<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="description" content="Sign in or create an account to join real-time flash auctions">
  <title>⚡ Sign In — BoltBid</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <header class="header">
    <div class="header-left">
      <div class="header-title">
        <span class="bolt">⚡</span>
        <h1>BoltBid</h1>
      </div>
    </div>
    <div class="header-stats">
      <a href="/admin/login" class="nav-tab">🛡️ Admin Portal</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-card" aria-label="Bidder Authentication">
      <div class="auth-brand">
        <div class="auth-emblem">⚡</div>
        <h2 id="auth-heading">Welcome Back</h2>
        <p id="auth-subheading">Sign in to join live auctions and place atomic bids</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tab-login" data-mode="login" role="tab" aria-selected="true">
          Sign In
        </button>
        <button type="button" class="auth-tab" id="tab-signup" data-mode="signup" role="tab" aria-selected="false">
          Create Account
        </button>
      </div>

      <div class="auth-alert" id="auth-alert" hidden></div>

      <!-- Sign In Form -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-field">
            <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pass-btn" data-toggle-target="login-password">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn">Sign In ⚡</button>
      </form>

      <!-- Create Account Form -->
      <form id="signup-form" class="auth-form" hidden novalidate>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" autocomplete="name" placeholder="Alex Mercer" maxlength="50" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password (min 6 characters)</label>
          <div class="password-field">
            <input type="password" id="signup-password" autocomplete="new-password" placeholder="Create a strong password" minlength="6" required>
            <button type="button" class="toggle-pass-btn" data-toggle-target="signup-password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="signup-confirm" autocomplete="new-password" placeholder="Repeat your password" minlength="6" required>
            <button type="button" class="toggle-pass-btn" data-toggle-target="signup-confirm">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="signup-submit-btn">Create Account ⚡</button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <button type="button" class="btn-google" id="google-auth-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12S6.7 21.6 12 21.6c6.9 0 9.6-4.8 9.6-7.3 0-.5-.1-.9-.1-1.3H12z"/>
          <path fill="#34A853" d="M3.5 7.4l3.2 2.3C7.6 7.6 9.6 6.1 12 6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.4 12 2.4 8.2 2.4 4.9 4.5 3.5 7.4z"/>
          <path fill="#FBBC05" d="M12 21.6c2.5 0 4.7-.8 6.3-2.3l-2.9-2.4c-.8.6-1.9 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1l-3.2 2.5c1.5 3 4.6 5.3 8.8 5.3z"/>
          <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-2H12v3.9h5.5c-.3 1.4-1.1 2.5-2.1 3.2l2.9 2.4c1.7-1.6 3.3-4 3.3-7.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-footer">
        <span>Credentials secured via Supabase Auth</span>
        <a href="/admin/login">Admin Login →</a>
      </div>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
